name: bootstrap-contracts-offline
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned tooling
        run: python -m pip install -r requirements/ci-constraints.txt
      - name: Install HIST-001 frozen numerical environment
        run: python -m pip install -r requirements/hist001-constraints.txt
      - name: Install package without an unpinned isolated build
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Security filename scan
        run: python tools/security_audit.py
      - name: Check manifest
        run: python tools/check_manifest.py --git-index
      - name: Lint source
        run: python -m ruff check src/native_eset tests tools
      - name: Test all synthetic/offline contracts
        run: python -m pytest -q
      - name: HIST001D frozen-grid sensitivity and independent source reexecution
        run: |
          python tools/hist001d_convergence.py --source-root research/legacy/hist001 --out runs/hist001d_ci
          python tools/hist001d_convergence.py --source-root research/legacy/hist001 --verify runs/hist001d_ci/receipt.json

      - name: HIST001D D2b independent projection-root numerical receipt
        run: |
          python tools/hist001d_d2b.py --source-root research/legacy/hist001 --out runs/hist001d_d2b
          python tools/hist001d_d2b.py --source-root research/legacy/hist001 --verify runs/hist001d_d2b/receipt.json
      - name: HIST001D D2c independent shadow projection and source reexecution
        run: |
          python tools/hist001d_d2c.py --source-root research/legacy/hist001 --out runs/hist001d_d2c
          python tools/hist001d_d2c.py --source-root research/legacy/hist001 --verify runs/hist001d_d2c/receipt.json
      - name: HIST001D D2d fully structured Einstein-root numerical source replay
        run: |
          python tools/hist001d_d2d.py --source-root research/legacy/hist001 --out runs/hist001d_d2d
          python tools/hist001d_d2d.py --source-root research/legacy/hist001 --verify runs/hist001d_d2d/receipt.json
      - name: HIST001D D2e-A sampled root topology and gradient/domain source reexecution
        run: |
          python tools/hist001d_d2e.py --source-root research/legacy/hist001 --out runs/hist001d_d2e_ci
          python tools/hist001d_d2e.py --source-root research/legacy/hist001 --verify runs/hist001d_d2e_ci/receipt.json
      - name: HIST001D D2e-B conditional interval root-exclusion source replay
        run: |
          python tools/hist001d_d2e_interval.py --source-root research/legacy/hist001 --out runs/hist001d_d2e_b_ci
          python tools/hist001d_d2e_interval.py --source-root research/legacy/hist001 --verify runs/hist001d_d2e_b_ci/receipt.json
      - name: HIST001D D2e-C original-source gradient and boundary error-menu reexecution
        run: |
          python tools/hist001d_d2e_error_budget.py --source-root research/legacy/hist001 --out runs/hist001d_d2e_c_ci
          python tools/hist001d_d2e_error_budget.py --source-root research/legacy/hist001 --verify runs/hist001d_d2e_c_ci/receipt.json
      - name: HIST001D D2e-D fixed-aperture exact-shadow proof and source reexecution
        run: |
          python tools/hist001d_d2e_d_exact_projection.py --source-root research/legacy/hist001 --out runs/hist001d_d2e_d_ci
          python tools/hist001d_d2e_d_exact_projection.py --source-root research/legacy/hist001 --verify runs/hist001d_d2e_d_ci/receipt.json
      - name: HIST001D D2e-E adaptive convex certified finite shadow source replay
        run: |
          python tools/hist001d_d2e_e_adaptive_projection.py --source-root research/legacy/hist001 --out runs/hist001d_d2e_e_ci
          python tools/hist001d_d2e_e_adaptive_projection.py --source-root research/legacy/hist001 --verify runs/hist001d_d2e_e_ci/receipt.json
      - name: HIST001D D2e-F aperture-band source replay and conditional-root audit
        run: |
          python tools/hist001d_d2e_f_shadow_guard.py --source-root research/legacy/hist001 --out runs/hist001d_d2e_f_ci
          python tools/hist001d_d2e_f_shadow_guard.py --source-root research/legacy/hist001 --verify runs/hist001d_d2e_f_ci/receipt.json
      - name: HIST001D D2e-G1/G2 certified analytic baryonic source run and replay
        run: |
          python tools/hist001d_d2e_g_baryon_boxes.py --source-root research/legacy/hist001 --out runs/hist001d_d2e_g_ci
          python tools/hist001d_d2e_g_baryon_boxes.py --source-root research/legacy/hist001 --verify runs/hist001d_d2e_g_ci/receipt.json
      - name: HIST001D D2e-G2b analytic disk certified angular source replay
        run: |
          python tools/hist001d_d2e_g2b_angular_boxes.py --source-root research/legacy/hist001 --out runs/hist001d_d2e_g2b_ci
          python tools/hist001d_d2e_g2b_angular_boxes.py --source-root research/legacy/hist001 --verify runs/hist001d_d2e_g2b_ci/receipt.json
      - name: HIST-001 original March source lock
        run: python tools/replay_hist001.py --preflight-only
      - name: CLI doctor
        run: python -m native_eset doctor
      - name: CLI RUN-000 cold control
        run: python -m native_eset run --spec tests/fixtures/E_of_z.json --out runs
      - name: Clean wheel/sdist build
        run: python -m build --no-isolation
      - name: Installed-wheel import check
        shell: bash
        run: |
          python -m pip uninstall -y native-eset
          python -m pip install dist/*.whl
          python -c "from native_eset.graph.snapshot import GraphSnapshot; from native_eset.runner import RunSpec; print('WHEEL_IMPORT_PASS')"
          python -c "from native_eset.historical.hist001_backend import LegacyHistJ2141Backend; from native_eset.historical.hist001_receipt import verify_hist001_receipt; from native_eset.capabilities import CAPABILITIES; assert CAPABILITIES['legacy-hist001-j2141-seta'].executable; print('HIST001_A3_HISTORICAL_CAPABILITY_SCOPED')"
          python -I -c "from native_eset.historical import HistoricalRunSpec; from native_eset.historical.hist001_approved import approved_hist001; assert approved_hist001()['source_file_count'] == 46; print('HIST001_A1_INSTALLED_TRUST_ANCHOR_PASS', HistoricalRunSpec.from_mode().spec_sha256)"
          python -I -c "from native_eset.historical.hist001c_crosswalk import load_pinned_crosswalk; assert len(load_pinned_crosswalk()['source_evidence']) == 9; print('HIST001C_NONCANONICAL_INSTALLED_WHEEL_PASS')"
          python -m native_eset doctor
          python -m native_eset run --spec tests/fixtures/E_of_z.json --out runs_wheel
          python -m native_eset run --spec tests/fixtures/chi_dimensionless_of_z.json --out runs_wheel
          python tools/wheel_smoke.py
      - name: Installed wheel historical cold replay outside checkout
        run: python tools/hist001_wheel_smoke.py
      - name: Upload source-reexecuted D2e release receipts (main only)
        if: ${{ success() && github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: hist001d-d2e-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.sha }}
          path: |
            runs/hist001d_d2e_ci/report.json
            runs/hist001d_d2e_ci/receipt.json
            runs/hist001d_d2e_ci/receipt.sha256
            runs/hist001d_d2e_b_ci/report.json
            runs/hist001d_d2e_b_ci/receipt.json
            runs/hist001d_d2e_b_ci/receipt.sha256
            runs/hist001d_d2e_c_ci/report.json
            runs/hist001d_d2e_c_ci/receipt.json
            runs/hist001d_d2e_c_ci/receipt.sha256
            runs/hist001d_d2e_d_ci/report.json
            runs/hist001d_d2e_d_ci/receipt.json
            runs/hist001d_d2e_d_ci/receipt.sha256
            runs/hist001d_d2e_e_ci/report.json
            runs/hist001d_d2e_e_ci/receipt.json
            runs/hist001d_d2e_e_ci/receipt.sha256
            runs/hist001d_d2e_f_ci/report.json
            runs/hist001d_d2e_f_ci/receipt.json
            runs/hist001d_d2e_f_ci/receipt.sha256
            runs/hist001d_d2e_g_ci/report.json
            runs/hist001d_d2e_g_ci/receipt.json
            runs/hist001d_d2e_g_ci/receipt.sha256
            runs/hist001d_d2e_g2b_ci/report.json
            runs/hist001d_d2e_g2b_ci/receipt.json
            runs/hist001d_d2e_g2b_ci/receipt.sha256
          if-no-files-found: error
          retention-days: 30
# Graph 31-source private cold replay is separately gated, not fetched using CI secrets.
