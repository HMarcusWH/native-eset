name: HIST001B official full diagnostic fail-closed receipt
on:
  pull_request:
    paths:
      - ".github/workflows/hist001b-diagnostic.yaml"
      - "tools/hist001b_*.py"
      - "src/native_eset/historical/hist001b_*.py"
      - "MANIFEST_SHA256.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hist001b-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  full-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install SHA-constrained historical dependencies
        run: |
          python -m pip install -r requirements/ci-constraints.txt
          python -m pip install -r requirements/hist001-constraints.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Verify source lock and original-600 fail-closed gate
        run: |
          python tools/check_manifest.py --git-index
          python tools/replay_hist001.py --preflight-only
          python -c "from native_eset.historical.hist001b_prechecks import precheck_status; s=precheck_status(); assert s['executed_original_cases']==0 and s['source_exact_replay_authorized'] is False; print('HIST001B_ORIGINAL_600_NOT_RECOVERED')"
      - name: Run official full 4x1000 diagnostic and independently verify receipt
        shell: bash
        run: |
          set +e
          python tools/hist001b_run.py --source-root research/legacy/hist001 --out "$RUNNER_TEMP/hist001b-full" > "$RUNNER_TEMP/hist001b-execution.json"
          rc=$?
          set -e
          test "$rc" -eq 4
          python - "$RUNNER_TEMP/hist001b-execution.json" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert report['status'] == 'HIST001B_SOURCE_NOT_RECOVERED_NO_ORACLE'
          assert report['source_exact_replay_authorized'] is False
          assert report['physical_provider_admitted'] is False
          assert report['empirical_validation'] == 'NOT_ESTABLISHED'
          root = pathlib.Path(report['output_dir'])
          assert len(list(root.glob('width_*pct.csv'))) == 4
          inspection = json.loads((root / 'independent_inspection.json').read_text())
          assert inspection['complete_archival_row_match'] is False
          assert inspection['original_600_prechecks_verified'] is False
          assert [r['n_at_6_of_6'] for r in inspection['widths']] == [328, 135, 14, 4]
          subprocess.run([
              sys.executable, 'tools/hist001b_verify.py',
              '--source-root', 'research/legacy/hist001',
              '--receipt', str(root / 'receipt.json'),
              '--expected-sha256', report['receipt_sha256'],
          ], check=True)
          print('HIST001B_OFFICIAL_FULL_DIAGNOSTIC_RECEIPT_VERIFIED_FAIL_CLOSED')
          PY
      - name: Retain numerical diagnostic and official receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hist001b-official-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hist001b-full/
            ${{ runner.temp }}/hist001b-execution.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain bounded source snapshot for external SHA-verified oracle replay
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hist001b-executable-source-${{ github.sha }}
          path: |
            src/native_eset/
            tools/hist001b_*.py
            research/legacy/hist001/
            requirements/hist001-constraints.txt
            requirements/ci-constraints.txt
            pyproject.toml
          if-no-files-found: error
          retention-days: 7
# Original oracle and 600 precheck case manifest remain external. The official
# run above is a diagnostic without --oracle-root, not historical source-exact replay.
