name: HIST001D D120 seam v1r2 attested source-only
on:
  push:
    branches:
      - hist001d/march180-d120-periodic-seam-source-review-2026-11-03
  pull_request:
    paths:
      - 'reference/hist001d_d120_seam_candidate/**'
      - 'tests/historical/test_hist001d_d120_*'
      - '.github/workflows/hist001d_d120_attested_v1r2_source_only.yml'
jobs:
  source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source-only test dependencies
        run: python -m pip install "numpy>=2,<3" "pytest>=7,<10"
      - name: Original 26 plus v1r2 22 source-free regression cases
        run: python -m pytest -q tests/historical/test_hist001d_d120_seam_source_free.py tests/historical/test_hist001d_d120_v1r2_attestation.py
