name: HIST001D signed K180 stencil v1r2 fail-closed source-only
on:
  push:
    branches:
      - hist001d/march180-signed-stencil-derivative-quadrature-split-2026-11-03
  pull_request:
    paths:
      - 'reference/hist001d_k180_signed_stencil_candidate/**'
      - 'tests/historical/test_hist001d_k180_signed_stencil_source_free.py'
      - 'tests/historical/test_hist001d_signed_stencil_v1r2_failclosed.py'
      - '.github/workflows/hist001d_signed_stencil_v1r2_source_only.yml'
jobs:
  source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source-free test dependency
        run: python -m pip install 'pytest>=7,<10'
      - name: Original plus fail-closed mathematical source-free tests (55)
        run: python -m pytest -q tests/historical/test_hist001d_k180_signed_stencil_source_free.py tests/historical/test_hist001d_signed_stencil_v1r2_failclosed.py
      - name: Source-free fail-closed controls under optimized Python (33)
        run: python -OO -m unittest discover -s tests/historical -p test_hist001d_signed_stencil_v1r2_failclosed.py -q
      - name: Unpinned historical release must fail closed under optimized Python
        shell: bash
        run: |
          python -OO reference/hist001d_k180_signed_stencil_candidate/verify_release.py --archive missing.zip --full > unpinned.json && exit 1 || status=$?
          if [ "${status}" -ne 2 ]; then exit 1; fi
          python -c 'import json; a=json.load(open("unpinned.json")); assert a["status"]=="UNRESOLVED"'
