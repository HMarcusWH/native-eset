name: HIST001D full H v1r2 fail-closed source-only
on:
  push:
    branches:
      - hist001d/march180-full-h-pl-vs-selected-mstar-bridge-2026-11-03
  pull_request:
    paths:
      - 'reference/hist001d_full_h_bridge_candidate/**'
      - 'tests/historical/test_hist001d_full_h_bridge*'
      - '.github/workflows/hist001d_full_h_v1r2_source_free.yml'
jobs:
  source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source-free test runner
        run: python -m pip install pytest
      - name: Original mathematics and optimized-Python fail-closed regressions (31)
        run: >-
          python -m pytest -q
          tests/historical/test_hist001d_full_h_bridge_source_free.py
          tests/historical/test_hist001d_full_h_bridge_v1r2_failclosed.py
